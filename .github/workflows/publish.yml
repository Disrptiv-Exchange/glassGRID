name: Publish glassGRID

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0). Leave blank to use the version in projects/glassgrid/package.json as-is.'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@disrptiv-exchange'

      - name: Install workspace deps
        working-directory: glassgrid-workspace
        run: npm ci

      - name: Override version (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        working-directory: glassgrid-workspace/projects/glassgrid
        run: npm version "${{ github.event.inputs.version }}" --no-git-tag-version

      - name: Sync version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: glassgrid-workspace/projects/glassgrid
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Publishing version $TAG_VERSION (from tag $GITHUB_REF)"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Build library
        working-directory: glassgrid-workspace
        run: npx ng build glassgrid

      - name: Publish to GitHub Packages
        working-directory: glassgrid-workspace/dist/glassgrid
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
